<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hangry Moons | Westwood's Favorite Late-Night Chicken Spot</title>
    <meta
      name="description"
      content="Crispy. Loaded. Open Late. Premium late-night fried chicken and loaded fries in Westwood, LA."
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                bg: '#050505',
                card: '#121212',
                border: '#262626',
                accent: '#eab308',
                accentHover: '#ca8a04',
                text: '#f8fafc',
                muted: '#a3a3a3',
              },
            },
          },
        },
      };
    </script>

    <style>
      body {
        background-color: #050505;
        color: #f8fafc;
      }
    </style>
  </head>
  <body class="antialiased selection:bg-brand-accent selection:text-black">
    <main class="max-w-7xl mx-auto px-6 py-10 space-y-16">
      <section>
        <h1 class="text-4xl md:text-6xl font-bold mb-4">Hangry Moons</h1>
        <p class="text-brand-muted">Westwood's favorite late-night chicken spot.</p>
      </section>

      <!-- Google Reviews Section -->
      <section id="reviews" class="py-8 border-y border-white/10">
        <div class="mb-6">
          <h2 class="text-3xl md:text-4xl font-bold uppercase tracking-tight">Word on the Street</h2>
          <p class="text-brand-muted mt-2">Live Google Reviews feed</p>
        </div>

        <!-- Elfsight Google Reviews | Untitled Google Reviews -->
        <script src="https://elfsightcdn.com/platform.js" async></script>
        <div class="elfsight-app-2cb8c591-bbae-4a3d-bd16-6c301b77d6bb" data-elfsight-app-lazy></div>
      </section>

      <!-- Contact / Catering Form -->
      <section id="contact" class="py-8">
        <h2 class="text-3xl md:text-4xl font-bold uppercase tracking-tight mb-3">Catering Request</h2>
        <p class="text-brand-muted mb-6">Planning a gathering? Send us a quick catering request.</p>

        <form
          id="contact-form"
          class="space-y-4 max-w-2xl"
          action="https://formspree.io/f/xqegqwgj"
          method="POST"
        >
          <div>
            <label for="name" class="block text-sm text-brand-muted mb-1 uppercase">Name</label>
            <input
              type="text"
              id="name"
              name="name"
              required
              class="w-full px-4 py-3 bg-brand-bg border border-brand-border rounded-sm"
            />
          </div>

          <div>
            <label for="email" class="block text-sm text-brand-muted mb-1 uppercase">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              required
              class="w-full px-4 py-3 bg-brand-bg border border-brand-border rounded-sm"
            />
          </div>

          <div>
            <label for="phone" class="block text-sm text-brand-muted mb-1 uppercase">Phone</label>
            <input
              type="tel"
              id="phone"
              name="phone"
              required
              class="w-full px-4 py-3 bg-brand-bg border border-brand-border rounded-sm"
            />
          </div>

          <div>
            <label for="message" class="block text-sm text-brand-muted mb-1 uppercase">Event Details</label>
            <textarea
              id="message"
              name="message"
              rows="5"
              required
              class="w-full px-4 py-3 bg-brand-bg border border-brand-border rounded-sm"
            ></textarea>
          </div>

          <input type="hidden" name="_subject" value="Hangry Moons Catering Request" />

          <button
            type="submit"
            class="px-8 py-3 bg-brand-accent text-black font-bold uppercase tracking-wide hover:bg-white transition-colors rounded-sm"
          >
            Submit Catering Request
          </button>
        </form>
      </section>
    </main>
  </body>
</html>
